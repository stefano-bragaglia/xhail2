[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xhail2"
version = "1.0.0"
description = "Python port of XHAIL — eXtended Hybrid Abductive Inductive Learning"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.14"
authors = [
  { name = "Stefano Bragaglia", email = "stefano.bragaglia@gmail.com" },
]
keywords = [
  "ilp",
  "inductive-logic-programming",
  "abduction",
  "induction",
  "deduction",
  "answer-set-programming",
  "asp",
  "nonmonotonic-reasoning",
  "machine-learning",
  "logic",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/stefano-bragaglia/xhail2"
Source = "https://github.com/stefano-bragaglia/xhail2"
Changelog = "https://github.com/stefano-bragaglia/xhail2/blob/main/CHANGELOG.md"

[project.scripts]
xhail = "xhail.application:main"

[project.optional-dependencies]
dev = [
  "pytest ==9.1.1",
  "pytest-cov ==7.1.0",
  "radon ==6.0.1",
  "ruff ==0.15.18",
  "xenon ==0.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xhail"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
python = "3.14"
features = ["dev"]

[tool.hatch.envs.default.scripts]
easy  = "radon cc -s src/ tests/"
lint  = "ruff check src/ tests/"
test  = "pytest --cov"
check = [
  "xenon --max-absolute A --max-modules A --max-average A src/ tests/",
  "ruff check src/ tests/",
  "pytest --cov",
]

[tool.ruff]
src = ["src"]
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/xhail"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
